[tool.poetry]
name = "structrag-mcp"
version = "0.1.0"
description = "The first open-source MCP server for structured RAG - automatic schema discovery, SQL analytics, and provenance over documents"
authors = ["Mohan Prakash Jeyasankar <your.email@example.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/mohan/structrag-mcp"
repository = "https://github.com/mohan/structrag-mcp"
keywords = ["mcp", "rag", "structured-data", "analytics", "llm", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{include = "structrag_mcp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastmcp = "^0.3.0"
duckdb = "^1.1.3"
chromadb = "^0.4.22"
openai = "^1.12.0"
anthropic = "^0.18.0"
pypdf = "^3.17.0"
pandas = "^2.1.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
tiktoken = "^0.5.2"
python-dotenv = "^1.0.0"
httpx = ">=0.27.0"
aiofiles = "^23.2.1"
rich = "^13.7.0"
streamlit = "^1.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.8.0"
ipython = "^8.20.0"
jupyter = "^1.0.0"

[tool.poetry.scripts]
structrag-mcp = "structrag_mcp.server:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
